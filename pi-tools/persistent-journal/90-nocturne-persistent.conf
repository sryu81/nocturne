# Nocturne: keep the journal across reboots and power cuts.
# Raspberry Pi OS ships Storage=volatile in /etc/systemd/journald.conf, so
# after the 2026-10-24 power cut nothing from the night (pier guard, Ekos
# restarts, USB drops) was left to read. This drop-in overrides it.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemKeepFree=1G
# Flush to disk often: a power cut loses at most this much.
SyncIntervalSec=30s
