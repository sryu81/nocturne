# Nocturne: keep the journal across reboots and power cuts.
# Raspberry Pi OS ships Storage=volatile in /etc/systemd/journald.conf, so a
# reboot or power cut wipes the night's logs. This drop-in overrides it.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemKeepFree=1G
# Flush to disk often: a power cut loses at most this much.
SyncIntervalSec=30s
